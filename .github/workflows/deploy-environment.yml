# Deploys one environment: the backend (Terraform, the deploy role's
# least-privilege OIDC credentials), smoke tests, then the client through the
# environment's hosting repository. Called by ci.yml: dev for every push to
# main, production for every published release (see docs/deployment.md).
name: Deploy an environment

on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment, which also names the AWS resources (dev, production)
        required: true
        type: string
      site-ref:
        description: What the hosting repository builds (a commit SHA for dev, the release tag for production)
        required: true
        type: string

permissions: {}

env:
  TERRAFORM_VERSION: "1.17.1"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC token for AWS (no stored AWS keys), and Sigstore signing
      attestations: write
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check environment configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ISSUER_KEY: ${{ secrets.ISSUER_KEY }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CLIENT_ORIGINS: ${{ vars.CLIENT_ORIGINS }}
          PAGES_REPO: ${{ vars.PAGES_REPO }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          PAGES_DISPATCH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
          LAMBDA_BUILDS_BUCKET: ${{ secrets.LAMBDA_BUILDS_BUCKET }}
          LAMBDA_SIGNING_PROFILE: ${{ secrets.LAMBDA_SIGNING_PROFILE }}
          LAMBDA_CODE_SIGNING_CONFIG: ${{ secrets.LAMBDA_CODE_SIGNING_CONFIG }}
        run: |
          missing=0
          for name in BOT_TOKEN ISSUER_KEY AWS_ROLE_ARN AWS_ACCOUNT_ID TF_STATE_BUCKET AWS_REGION CLIENT_ORIGINS \
            PAGES_REPO PAGES_URL PAGES_DISPATCH_TOKEN LAMBDA_BUILDS_BUCKET LAMBDA_SIGNING_PROFILE LAMBDA_CODE_SIGNING_CONFIG; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the ${ENVIRONMENT} environment"
              missing=1
            fi
          done
          # Catch a mis-pasted secret before anything is written to AWS.
          if [ -n "$BOT_TOKEN" ] && ! [[ "$BOT_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo "::error::BOT_TOKEN doesn't look like a Telegram bot token"
            missing=1
          fi
          if [ -n "$ISSUER_KEY" ] && [[ "$ISSUER_KEY" != "-----BEGIN PRIVATE KEY-----"* ]]; then
            echo "::error::ISSUER_KEY isn't a PKCS#8 PEM private key"
            missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The hosting repository checks the same before it builds the tag.
      - name: Check the release is on main
        if: inputs.environment == 'production'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::This release isn't a commit on main"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-bundles
          path: backend/dist

      # Public, signed provenance for the function builds about to be
      # deployed. The builds are reproducible, so anyone can rebuild this
      # commit and compare (docs/verifying.md).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: backend/dist/*.zip

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: github-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800

      - name: Terraform init
        working-directory: infra
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: >-
          terraform init -lockfile=readonly
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"

      # Workflow logs are public. Hide the endpoints of earlier deploys before
      # Terraform prints anything (there are none on the first deploy).
      - name: Mask endpoints
        working-directory: infra
        run: |
          for name in api_url ws_url webhook_url media_origin; do
            value=$(terraform output -raw "$name" 2>/dev/null || true)
            if [ -n "$value" ]; then
              echo "::add-mask::${value}"
              host=${value#*://}
              echo "::add-mask::${host%%[/.]*}"
            fi
          done

      - name: Terraform plan
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_bot_token: ${{ secrets.BOT_TOKEN }}
          TF_VAR_bot_token_version: ${{ vars.BOT_TOKEN_VERSION || '1' }}
          TF_VAR_issuer_key: ${{ secrets.ISSUER_KEY }}
          TF_VAR_issuer_key_version: ${{ vars.ISSUER_KEY_VERSION || '1' }}
          TF_VAR_secrets_version: ${{ vars.SECRETS_VERSION || '1' }}
          TF_VAR_client_origins: ${{ vars.CLIENT_ORIGINS }}
          TF_VAR_deletion_protection: ${{ vars.DELETION_PROTECTION || 'true' }}
          TF_VAR_invite_only: ${{ vars.INVITE_ONLY || 'true' }}
          TF_VAR_reserve_concurrency: ${{ vars.RESERVE_CONCURRENCY || 'false' }}
          # A secret only so that it is masked in these public logs.
          TF_VAR_admin_telegram_ids: ${{ secrets.ADMIN_TELEGRAM_IDS }}
          # Code signing, from infra/init.
          TF_VAR_lambda_builds_bucket: ${{ secrets.LAMBDA_BUILDS_BUCKET }}
          TF_VAR_lambda_signing_profile: ${{ secrets.LAMBDA_SIGNING_PROFILE }}
          TF_VAR_lambda_code_signing_config_arn: ${{ secrets.LAMBDA_CODE_SIGNING_CONFIG }}
        # Refreshed resources are printed with their IDs (such as the media
        # bucket's name): hidden, as in apply.
        run: |
          set -o pipefail
          terraform plan -no-color -out=tfplan | sed -E 's/\[id=[^]]*\]/[id=***]/'

      - name: Terraform apply
        working-directory: infra
        env:
          # Ephemeral variables aren't saved in the plan file; supply them again.
          TF_VAR_bot_token: ${{ secrets.BOT_TOKEN }}
          TF_VAR_issuer_key: ${{ secrets.ISSUER_KEY }}
        # Resource IDs (such as the WebSocket API's) are printed on creation.
        # pipefail: without it, a failed apply would pass through sed as a success.
        run: |
          set -o pipefail
          terraform apply -no-color tfplan | sed -E 's/\[id=[^]]*\]/[id=***]/'

      # Fetches the code each function runs from Lambda and checks it is the
      # attested build plus AWS Signer's signature; prints both hashes.
      - name: Check the deployed code
        run: python3 scripts/check-lambda-deploy.py backend/dist "incognitochat-${ENVIRONMENT}"

      - name: Read endpoints
        working-directory: infra
        run: |
          for name in api_url ws_url webhook_url media_origin; do
            value=$(terraform output -raw "$name")
            echo "::add-mask::${value}"
            host=${value#*://}
            echo "::add-mask::${host%%[/.]*}"
            echo "$(echo "$name" | tr '[:lower:]' '[:upper:]')=${value}" >> "$GITHUB_ENV"
          done

      - name: Smoke test – API answers with JSON errors
        run: |
          body=$(curl -sS --max-time 30 -w '\n%{http_code}' "${API_URL%/}/no-such-route")
          status=${body##*$'\n'}
          if [ "$status" != "404" ] || [[ "$body" != *'"error":"not_found"'* ]]; then
            echo "::error::Expected a 404 JSON error from the API, got HTTP ${status}"
            exit 1
          fi
          echo "API reachable (HTTP 404 with a JSON error)"

      # A login for a device that doesn't exist: the function must have loaded
      # its parameters and be able to read the directory table to refuse it.
      - name: Smoke test – API refuses an unknown device
        run: |
          rand_id() { head -c 16 /dev/urandom | basenc -w0 --base64url | tr -d "="; }
          payload=$(printf '{"account":"%s","device":"%s","timestamp":%d,"nonce":"%s","signature":"%s"}' \
            "$(rand_id)" "$(rand_id)" "$(date +%s)" "$(rand_id)" "$(head -c 64 /dev/zero | basenc -w0 --base64url | tr -d "=")")
          body=$(curl -sS --max-time 30 -w '\n%{http_code}' -H 'Content-Type: application/json' \
            -d "$payload" "${API_URL%/}/session")
          status=${body##*$'\n'}
          if [ "$status" != "401" ] || [[ "$body" != *'"error":"login_refused"'* ]]; then
            echo "::error::Expected 401 login_refused from POST /session, got HTTP ${status}"
            exit 1
          fi
          echo "API loaded its configuration and reads the directory (HTTP 401 login_refused)"

      # A send without a token: the API must have loaded its issuer key to
      # get this far, and refuses it after checking the envelope.
      - name: Smoke test – sends need a token
        run: |
          envelope=$(head -n 1 backend/internal/envelope/testdata/client-envelopes.hex | tr -d '\n' | tr a-f A-F | basenc --base16 -d | basenc -w0 --base64url | tr -d '=')
          mailbox=$(head -c 16 /dev/urandom | basenc -w0 --base64url | tr -d '=')
          body=$(curl -sS --max-time 30 -w '\n%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"mailbox\":\"${mailbox}\",\"envelope\":\"${envelope}\"}" "${API_URL%/}/send")
          status=${body##*$'\n'}
          if [ "$status" != "401" ] || [[ "$body" != *'"error":"invalid_token"'* ]]; then
            echo "::error::Expected 401 invalid_token from POST /send without a token, got HTTP ${status}"
            exit 1
          fi
          echo "Sends need a token (HTTP 401 invalid_token)"

      - name: Smoke test – webhook is reachable
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST -d '{}' "$WEBHOOK_URL")
          if [ "$status" != "404" ]; then
            echo "::error::Expected HTTP 404 from the webhook stub, got ${status}"
            exit 1
          fi
          echo "Webhook reachable (HTTP 404 until the bot is built)"

      # The bot registers its own webhook (with its secret) and menu button:
      # neither the bot token nor the webhook secret passes through CI.
      - name: Set up the bot
        working-directory: infra
        run: |
          function=$(terraform output -raw bot_function_name)
          payload=$(jq -nc --arg url "$WEBHOOK_URL" '{setup: {webhookUrl: $url}}')
          failed=$(aws lambda invoke --function-name "$function" --cli-binary-format raw-in-base64-out \
            --payload "$payload" --query FunctionError --output text "$RUNNER_TEMP/bot-setup.json")
          if [ "$failed" != "None" ] || ! jq -e '.ok == true' "$RUNNER_TEMP/bot-setup.json" >/dev/null; then
            echo "::error::Bot setup failed"
            exit 1
          fi
          echo "Webhook, menu button and /start command are set"

      - name: Smoke test – the notify function starts
        working-directory: infra
        run: |
          # An empty account is the no-op the api sends for unknown mailboxes;
          # it proves the function reads its parameters and starts.
          function=$(terraform output -raw notify_function_name)
          failed=$(aws lambda invoke --function-name "$function" --cli-binary-format raw-in-base64-out \
            --payload '{"notify":{"account":""}}' --query FunctionError --output text "$RUNNER_TEMP/notify.json")
          if [ "$failed" != "None" ]; then
            echo "::error::The notify function failed"
            exit 1
          fi
          echo "The notify function starts"

      - name: Smoke test – sockets refuse unauthenticated connections
        run: |
          # Without a session token, and with a forged one (the ws function
          # must start and check it).
          for protocols in "" "v1, v1.forged.token"; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --http1.1 \
              -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' \
              -H 'Sec-WebSocket-Key: c21va2UtdGVzdC1rZXktMQ==' ${protocols:+-H "Sec-WebSocket-Protocol: ${protocols}"} \
              "https://${WS_URL#wss://}")
            if [ "$status" != "403" ]; then
              echo "::error::Expected HTTP 403 for a socket with protocols '${protocols}', got ${status}"
              exit 1
            fi
          done
          echo "Sockets refuse unauthenticated connections (HTTP 403)"

      # The client is built, attested and deployed by the site's own workflow
      # (hosting/deploy.yml, kept in that repository), from this very commit:
      # dev builds the commit, production its release tag. The token can only
      # start that workflow, not change the site.
      - name: Ask the site to build this commit
        env:
          GH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
          PAGES_REPO: ${{ vars.PAGES_REPO }}
          SITE_REF: ${{ inputs.site-ref }}
        run: gh workflow run deploy.yml --repo "$PAGES_REPO" --field ref="$SITE_REF"

      - name: Wait for the client to go live
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          for _ in $(seq 1 60); do
            manifest=$(curl -sS --max-time 10 "${PAGES_URL%/}/manifest.json?v=${GITHUB_SHA}-${RANDOM}" || true)
            if [ "$(jq -r '.commit // empty' <<<"$manifest" 2>/dev/null)" = "$GITHUB_SHA" ]; then
              if [ "$(jq -r '.build.VITE_API_URL' <<<"$manifest")" != "$API_URL" ]; then
                echo "::error::The site was built for another API; update its API_URL variable"
                exit 1
              fi
              echo "The client built from this commit is live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The site didn't serve this commit within 10 minutes"
          exit 1
