name: CI

# Every pull request, every push to main and every release is tested and
# built. Pushes to main deploy to dev and update the release pull request;
# published releases deploy to production (deploy-environment.yml). Each
# environment has its own AWS account and accepts only its own refs: dev
# main, production release tags (see scripts/bootstrap.sh).
# Pull requests never get cloud access or secrets.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default; jobs opt in to more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: "1.17.1"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  backend:
    name: Backend – test, scan & reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      # For the store tests (backend/internal/dynamotest). Pinned by digest.
      dynamodb:
        image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check the pinned toolchain
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          got=$(go env GOVERSION)
          if [ "$got" != "$want" ]; then
            echo "::error::Go is $got, but go.mod pins $want"
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt on: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Wait for DynamoDB Local
        run: |
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          echo "::error::DynamoDB Local didn't start"
          exit 1

      - name: Test
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          DYNAMODB_REQUIRED: "1" # store tests must run, not skip
        run: go test -race ./...

      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build Lambda bundles twice and compare
        run: |
          ../scripts/build-lambdas.sh dist | tee first.txt
          go clean -cache
          ../scripts/build-lambdas.sh dist-again > second.txt
          if ! diff first.txt second.txt; then
            echo "::error::The Lambda build is not reproducible"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-bundles
          path: backend/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web – typecheck, test & reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify package signatures and provenance
        run: npm audit signatures

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build twice and compare
        run: |
          npm run build
          (cd dist && find . -type f | sort | xargs sha256sum) | tee ../first.txt
          rm -rf dist node_modules/.vite
          npm run build
          (cd dist && find . -type f | sort | xargs sha256sum) > ../second.txt
          if ! diff ../first.txt ../second.txt; then
            echo "::error::The web build is not reproducible"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  terraform:
    name: Terraform – format & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff infra

      - name: Validate
        run: |
          for dir in infra infra/init; do
            terraform -chdir="$dir" init -backend=false -lockfile=readonly
            terraform -chdir="$dir" validate
          done

  deploy-dev:
    name: Deploy to dev
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, web, terraform]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      site-ref: ${{ github.sha }}
    secrets: inherit

  # release-please keeps a release pull request up to date from the
  # Conventional Commit titles on main (version and changelog). Merging it
  # tags the release and publishes it, which deploys production (below). It
  # uses a GitHub App's token: pull requests opened with GITHUB_TOKEN get no
  # CI, and releases published with it start no workflows.
  release:
    name: Release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, web, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions: {}
    steps:
      - name: Get a token for the release app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A published release (tag vX.Y.Z on main) deploys production after the
  # production environment's required reviewer approves it.
  deploy-production:
    name: Deploy to production
    if: github.event_name == 'release'
    needs: [backend, web, terraform]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      site-ref: ${{ github.event.release.tag_name }}
    secrets: inherit
