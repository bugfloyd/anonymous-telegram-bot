version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /bot
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra
      - /infra/init
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]

  # Local development images (golang, DynamoDB Local).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
